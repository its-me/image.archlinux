name: Daily images

on:
  schedule:
    - cron: "30 9 * * *"

env:
  REPOSITORY: archlinux

jobs:
  build-base:
    name: "GHCR: Build and push base"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.tags.outputs.list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: arch-linux

      # The image's own installed-package list is the only meaningful
      # "version" for a rolling-release distro, so it has to be resolved from
      # a first build before it can be baked in as a label on the pushed one.
      - name: Resolve version
        id: version
        run: |
          hash=$(docker run --rm arch-linux pacman -Q | sha256sum | cut -d' ' -f1)
          echo "value=$hash" >> $GITHUB_OUTPUT

      - name: Resolve tags
        id: tags
        run: |
          date_tag=$(date -u +%y%m%d)
          echo "date=$date_tag" >> "$GITHUB_OUTPUT"
          echo "list=latest $date_tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/its-me/${{ env.REPOSITORY }}:latest
            ghcr.io/its-me/${{ env.REPOSITORY }}:${{ steps.tags.outputs.date }}

  push-base-hub:
    name: "Docker Hub: Publish base"
    needs: build-base
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/${{ env.REPOSITORY }}
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: ${{ secrets.HUB_USERNAME }}/${{ env.REPOSITORY }}
          destination-username: ${{ secrets.HUB_USERNAME }}
          destination-password: ${{ secrets.HUB_TOKEN }}
          tags: ${{ needs.build-base.outputs.tags }}

  push-base-quay:
    name: "Quay: Publish base"
    needs: build-base
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - name: Resolve Quay namespace
        id: namespace
        env:
          QUAY_NAMESPACE: ${{ secrets.QUAY_USERNAME }}
        run: echo "value=${QUAY_NAMESPACE%%+*}" >> "$GITHUB_OUTPUT"

      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/${{ env.REPOSITORY }}
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: quay.io/${{ steps.namespace.outputs.value }}/${{ env.REPOSITORY }}
          destination-username: ${{ secrets.QUAY_USERNAME }}
          destination-password: ${{ secrets.QUAY_TOKEN }}
          tags: ${{ needs.build-base.outputs.tags }}

  build-builder:
    name: "GHCR: Build and push builder"
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.tags.outputs.list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.builder
          load: true
          tags: arch-linux-builder

      - name: Resolve version
        id: version
        run: |
          hash=$(docker run --rm arch-linux-builder pacman -Q | sha256sum | cut -d' ' -f1)
          echo "value=$hash" >> $GITHUB_OUTPUT

      - name: Resolve tags
        id: tags
        run: |
          date_tag=$(date -u +%y%m%d)
          echo "date=$date_tag" >> "$GITHUB_OUTPUT"
          echo "list=builder builder-$date_tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.builder
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/its-me/${{ env.REPOSITORY }}:builder
            ghcr.io/its-me/${{ env.REPOSITORY }}:builder-${{ steps.tags.outputs.date }}

  push-builder-hub:
    name: "Docker Hub: Publish builder"
    needs: build-builder
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/${{ env.REPOSITORY }}
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: ${{ secrets.HUB_USERNAME }}/${{ env.REPOSITORY }}
          destination-username: ${{ secrets.HUB_USERNAME }}
          destination-password: ${{ secrets.HUB_TOKEN }}
          tags: ${{ needs.build-builder.outputs.tags }}

  push-builder-quay:
    name: "Quay: Publish builder"
    needs: build-builder
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - name: Resolve Quay namespace
        id: namespace
        env:
          QUAY_NAMESPACE: ${{ secrets.QUAY_USERNAME }}
        run: echo "value=${QUAY_NAMESPACE%%+*}" >> "$GITHUB_OUTPUT"

      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/${{ env.REPOSITORY }}
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: quay.io/${{ steps.namespace.outputs.value }}/${{ env.REPOSITORY }}
          destination-username: ${{ secrets.QUAY_USERNAME }}
          destination-password: ${{ secrets.QUAY_TOKEN }}
          tags: ${{ needs.build-builder.outputs.tags }}
